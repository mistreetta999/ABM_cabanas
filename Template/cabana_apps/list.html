{% extends 'cabana_apps/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">{{ titulo }}</h1>
    <a class="btn btn-verde" href="{% url crear_url %}">Agregar</a>
</div>

<div class="card shadow-sm border-0 tarjeta">
    <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-success">
                <tr>
                    <th>Registro</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for objeto in objetos %}
                <tr>
                    <td>{{ objeto }}</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-warning" href="{% url editar_url objeto.pk %}">Editar</a>
                        <a class="btn btn-sm btn-danger" href="{% url borrar_url objeto.pk %}">Borrar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center py-4">Todavia no hay registros cargados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
