{% extends 'cabana_apps/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="card tarjeta shadow-sm border-0">
    <div class="card-body p-4">
        <h1 class="h3 text-verde-medio mb-4">{{ titulo }}</h1>
        <form method="post" class="row g-3">
            {% csrf_token %}
            {% for field in form %}
            <div class="col-md-6">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-verde" type="submit">Guardar</button>
                <a class="btn btn-secondary" href="{% url 'panel_abm' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
