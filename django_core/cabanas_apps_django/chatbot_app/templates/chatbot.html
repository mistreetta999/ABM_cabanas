<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <style>
        #chatbox {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }
        #user-input {
            width: 80%;
            padding: 8px;
        }
        #send-btn {
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <h1>Asistente Virtual</h1>
    <div id="chatbox">
        <!-- Mensajes del chatbot se renderizan aquí -->
        {% for mensaje in mensajes %}
            <p><strong>{{ mensaje.usuario }}:</strong> {{ mensaje.texto }}</p>
        {% empty %}
            <p>No hay mensajes aún.</p>
        {% endfor %}
    </div>

    <form method="post">
        {% csrf_token %}
        <input type="text" id="user-input" name="mensaje" placeholder="Escribe tu mensaje...">
        <button type="submit" id="send-btn">Enviar</button>
    </form>
</body>
</html>
