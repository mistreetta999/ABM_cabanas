<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cabaña</title>
</head>
<body>
    <h1>Registrar nueva cabaña</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
    <a href="{% url 'cabanas:lista_cabanas' %}">Volver</a>
</body>
</html>
