<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Cliente</title>
</head>
<body>
    <h1>Eliminar Cliente</h1>
    <p>¿Estás segura de que querés eliminar al cliente {{ cliente.nombre }} {{ cliente.apellido }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <a href="{% url 'clientes:detalle_cliente' cliente.pk %}">Cancelar</a>
</body>
</html>
