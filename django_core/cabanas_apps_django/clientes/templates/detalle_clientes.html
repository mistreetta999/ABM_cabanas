<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Cliente</title>
</head>
<body>
    <h1>{{ cliente.nombre }} {{ cliente.apellido }}</h1>
    <p><strong>Email:</strong> {{ cliente.email }}</p>
    <p><strong>Teléfono:</strong> {{ cliente.telefono }}</p>
    <p><strong>Dirección:</strong> {{ cliente.direccion }}</p>

    <a href="{% url 'clientes:editar_cliente' cliente.pk %}">Editar</a> |
    <a href="{% url 'clientes:eliminar_cliente' cliente.pk %}">Eliminar</a> |
    <a href="{% url 'clientes:lista_clientes' %}">Volver a la lista</a>
</body>
</html>
