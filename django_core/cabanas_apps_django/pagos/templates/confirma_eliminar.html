{% extends "base.html" %}
{% block content %}
<h2>Eliminar Pago</h2>
<p>¿Estás seguro que querés eliminar el pago de <strong>{{ pago.cliente }}</strong> por {{ pago.monto }}?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'lista_pagos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
